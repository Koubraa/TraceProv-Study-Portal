<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TraceProv Validation</title>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="accounts.js"></script>
    <script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
    <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
    <script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
  </head>
  <body>
    <section id="loginView" class="login-view">
      <form id="loginForm" class="login-box">
        <p class="eyebrow">TraceProv study portal</p>
        <h1>Sign in to validate your assigned traces</h1>
        <label>Username<input id="username" autocomplete="username" required></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
        <p id="loginError" class="error"></p>
        <button>Sign in</button>
      </form>
    </section>
    <section id="appView" hidden>
      <header class="topbar"><div><strong>TraceProv</strong><span>Human Validation</span></div><span id="userName"></span><span id="progress"></span><button id="logout" class="secondary">Sign out</button></header>
      <main>
        <aside><select id="caseSelect" aria-label="Assigned case"></select><p class="quiet">Your study account has ten assigned cases. Click highlighted graph events to attach reviewer evidence.</p><div id="tabs"></div><p id="caseStatus" class="quiet"></p><button id="submit">Submit completed case</button></aside>
        <section class="questions"><div class="heading"><div><p id="familyName" class="eyebrow"></p><h1 id="caseTitle"></h1></div><button id="acceptFamily" class="secondary">Accept both answers</button></div><div id="cards"></div></section>
        <section class="graph-panel"><div class="graph-heading"><strong>Provenance graph</strong><span id="hint"></span><button id="fit" class="icon">&#10530;</button></div><div id="graph"></div><pre id="detail">Select an event to inspect its APG details.</pre></section>
      </main>
    </section>
    <script src="app.js"></script>
  </body>
</html>
